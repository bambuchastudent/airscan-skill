name: Bootstrap verification

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify wrapper executable mode
        run: |
          test -x ./mvnw
          test "$(git ls-files --stage mvnw | awk '{print $1}')" = 100755
      - name: Runtime versions
        run: |
          java -version
          javac -version
          ./mvnw -version
      - name: Bootstrap contracts
        run: |
          test -s AGENTS.md
          test -s docs/TOOLING.md
          test -s formal/INVARIANTS.md
          test -s openspec/config.yaml
          test -s openspec/changes/bootstrap-agentic-foundation/tasks.md
      - name: Deterministic Java formatting check
        run: ./mvnw -B -ntp spotless:check
      - name: Maven verification and Quarkus HTTP tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp clean verify 2>&1 | tee maven-verify.log
          if grep -E 'IllegalAccessError|NoClassDefFoundError|Exception in thread' maven-verify.log; then
            echo 'BLOCKER: uncaught runtime exception in Maven/Quarkus logs' >&2
            exit 1
          fi
      - name: Independent worker bootstrap
        run: ./mvnw -B -ntp -f worker/pom.xml clean verify
      - name: Execute worker entrypoint
        shell: bash
        run: |
          set -euo pipefail
          actual=$(java -cp worker/target/classes dev.airscan.worker.WorkerBootstrap)
          test "$actual" = 'airscan-worker-bootstrap ready'
      - name: Verify tracked secret and runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(\.env($|\.)|[^/]*service.account[^/]*\.json$|[^/]*credentials[^/]*\.json$|[^/]*\.(sqlite|sqlite3|db)$|target/)'; then
            echo 'Tracked runtime artifact or possible credential' >&2
            exit 1
          fi
      - name: Inspect worker dependencies
        run: ./mvnw -B -ntp -f worker/pom.xml dependency:tree

  openspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.14.0
      - name: Inspect OpenSpec
        run: |
          openspec --version
          openspec validate --help
      - name: Validate bootstrap change
        run: openspec validate bootstrap-agentic-foundation --strict
      - name: Validate all active changes
        run: openspec validate --changes --strict
