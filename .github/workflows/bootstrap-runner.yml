name: Bootstrap verification

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Runtime versions
        run: |
          java -version
          javac -version
          mvn -version
      - name: Bootstrap contracts
        run: |
          test -s AGENTS.md
          test -s docs/TOOLING.md
          test -s formal/INVARIANTS.md
          test -s openspec/config.yaml
          test -s openspec/changes/bootstrap-agentic-foundation/tasks.md
      - name: Maven verification
        if: hashFiles('pom.xml') != ''
        run: mvn -B -ntp verify
      - name: No Maven project yet
        if: hashFiles('pom.xml') == ''
        run: echo 'NOT VERIFIED — pom.xml absent; Maven gate not executed'

  openspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.14.0
      - name: Inspect OpenSpec
        run: |
          openspec --version
          openspec validate --help
      - name: Validate bootstrap change
        run: openspec validate bootstrap-agentic-foundation --strict
