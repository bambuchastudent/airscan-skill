name: Bootstrap verification

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify wrapper executable mode
        run: |
          test -x ./mvnw
          test "$(git ls-files --stage mvnw | awk '{print $1}')" = 100755
      - name: Validate wrapper metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^distributionUrl=https://repo.maven.apache.org/maven2/' .mvn/wrapper/maven-wrapper.properties
          ./mvnw -version
      - name: Runtime versions
        run: |
          java -version
          javac -version
          ./mvnw -version
      - name: Bootstrap contracts
        run: |
          test -s AGENTS.md
          test -s docs/TOOLING.md
          test -s formal/INVARIANTS.md
          test -s openspec/config.yaml
          test -s openspec/changes/bootstrap-agentic-foundation/tasks.md
      - name: Deterministic Java formatting check
        run: ./mvnw -B -ntp spotless:check
      - name: Java static analysis (Checkstyle)
        run: ./mvnw -B -ntp checkstyle:check
      - name: Maven verification and Quarkus HTTP tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp clean verify 2>&1 | tee maven-verify.log
          if grep -E 'IllegalAccessError|NoClassDefFoundError|Exception in thread|Could not initialize class org.jboss.threads|LogManager was not properly installed' maven-verify.log; then
            echo 'BLOCKER: uncaught runtime exception in Maven/Quarkus logs' >&2
            exit 1
          fi
      - name: Upload Maven diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-maven-diagnostics
          path: |
            maven-verify.log
            target/surefire-reports/**
            worker/target/surefire-reports/**
          if-no-files-found: warn
      - name: Verify real Quarkus test results
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = glob.glob('target/surefire-reports/TEST-*.xml')
          assert reports, 'No Surefire XML reports: tests were not executed'
          total = failures = errors = skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              total += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'Quarkus tests={total}, failures={failures}, errors={errors}, skipped={skipped}')
          assert total >= 3 and failures == errors == skipped == 0, 'Quarkus tests missing, skipped or failing'
          PY
      - name: Independent worker bootstrap
        run: ./mvnw -B -ntp -f worker/pom.xml clean verify
      - name: Verify worker test results
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          reports = glob.glob('worker/target/surefire-reports/TEST-*.xml')
          assert reports, 'No worker Surefire XML reports'
          results = [ET.parse(path).getroot() for path in reports]
          tests = sum(int(r.attrib.get('tests', 0)) for r in results)
          bad = sum(int(r.attrib.get(k, 0)) for r in results for k in ('failures', 'errors', 'skipped'))
          print(f'Worker tests={tests}, failed/errors/skipped={bad}')
          assert tests >= 1 and bad == 0
          PY
      - name: Execute worker entrypoint
        shell: bash
        run: |
          set -euo pipefail
          actual=$(java -cp worker/target/classes dev.airscan.worker.WorkerBootstrap)
          test "$actual" = 'airscan-worker-bootstrap ready'
      - name: Verify tracked secret and runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(\.env($|\.)|[^/]*service.account[^/]*\.json$|[^/]*credentials[^/]*\.json$|[^/]*\.(sqlite|sqlite3|db)$|target/)'; then
            echo 'Tracked runtime artifact or possible credential' >&2
            exit 1
          fi
      - name: Inspect worker dependencies
        run: ./mvnw -B -ntp -f worker/pom.xml dependency:tree

  openspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.14.0
      - name: Inspect OpenSpec
        run: |
          openspec --version
          openspec validate --help
      - name: Validate bootstrap change
        run: openspec validate bootstrap-agentic-foundation --strict
      - name: Validate all active changes
        run: openspec validate --changes --strict

  tlc-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned TLC tool
        run: curl --fail --location --retry 3 --output /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: Check finite bootstrap gate
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config formal/bootstrap/BootstrapGate.cfg formal/bootstrap/BootstrapGate.tla

  alloy-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Alloy command line distribution
        run: curl --fail --location --retry 3 --output /tmp/alloy.jar https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
      - name: Bounded Alloy checks
        run: java -jar /tmp/alloy.jar exec -c '*' -o /tmp/alloy-results formal/bootstrap/BootstrapGate.als

  dafny-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Dafny
        run: |
          curl --fail --location --retry 3 --output /tmp/dafny.zip https://github.com/dafny-lang/dafny/releases/download/v4.11.0/dafny-4.11.0-x64-ubuntu-22.04.zip
          unzip -q /tmp/dafny.zip -d /tmp/dafny-dist
          find /tmp/dafny-dist -type f -name dafny -exec chmod +x {} \;
          echo "$(dirname "$(find /tmp/dafny-dist -type f -name dafny | head -1)")" >> "$GITHUB_PATH"
      - name: Verify Dafny bootstrap function
        run: dafny verify formal/bootstrap/BootstrapGate.dfy
      - name: Generate and compile Java from verified Dafny
        run: |
          mkdir -p /tmp/dafny-java
          dafny translate java formal/bootstrap/BootstrapGate.dfy --output /tmp/dafny-java/BootstrapGate.java
          find /tmp/dafny-java -type f | sort
          test -s /tmp/dafny-java/BootstrapGate-java/BootstrapGate.java
          test -s /tmp/dafny-java/BootstrapGate-java/GateLogic/__default.java
          # Dafny's Java backend needs its generated runtime library; compile via the
          # supported build command rather than pretending bare javac is sufficient.
          dafny build --target:java formal/bootstrap/BootstrapGate.dfy
          find formal/bootstrap -type f -name '*.jar' -print
      - name: Execute generated Dafny Java
        run: dafny run --target:java formal/bootstrap/BootstrapGate.dfy

  java-symbol-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Java symbols and call relationships
        run: |
          python3 scripts/java-symbol-smoke.py --root . --output java-symbol-evidence
      - name: Upload symbol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-symbol-bootstrap-evidence
          path: java-symbol-evidence/
          retention-days: 14
          if-no-files-found: warn

  graphify-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin scripting runtime
        run: |
          curl -fsSL -o /tmp/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin-runtime
          echo "/tmp/kotlin-runtime/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install Java-capable Graphify
        run: |
          python -m pip install 'graphifyy==0.1.14'
          python -m pip show graphifyy
      - name: Build shared Graphify index and verify cache reuse
        run: |
          kotlin scripts/graphify-shared-cache.main.kts --root . --cache-dir /tmp/airscan-shared-graph --output graphify-evidence | tee /tmp/graphify-first.json
          kotlin scripts/graphify-shared-cache.main.kts --root . --cache-dir /tmp/airscan-shared-graph --output graphify-evidence | tee /tmp/graphify-second.json
          python - <<'PY'
          import json
          first=json.load(open('/tmp/graphify-first.json'))
          second=json.load(open('/tmp/graphify-second.json'))
          assert first['cache_hit'] is False, 'First run must build graph'
          assert second['cache_hit'] is True, 'Second run must reuse graph'
          assert second['nodes'] >= 2 and second['edges'] >= 1
          PY
      - name: Upload Graphify Java evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphify-java-bootstrap-evidence
          path: graphify-evidence/
          retention-days: 14
          if-no-files-found: warn

  serena-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Kotlin scripting runtime
        run: |
          curl -fsSL -o /tmp/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin-runtime
          echo "/tmp/kotlin-runtime/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install Serena and MCP client
        run: |
          python -m pip install 'git+https://github.com/oraios/serena.git' 'mcp>=1.0,<2'
          serena --version
      - name: Verify Java semantic references
        run: kotlin scripts/serena-semantic-smoke.main.kts
      - name: Upload Serena evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serena-java-semantic-evidence
          path: serena-evidence/
          retention-days: 14
          if-no-files-found: warn
